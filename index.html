<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catering Mama Gigi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- html2pdf for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const Icons = {
          Search: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>,
          Plus: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
          Minus: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="5" y1="12" x2="19" y2="12"></line></svg>,
          Trash: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
          ShoppingCart: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>,
          History: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>,
          Printer: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>,
          Download: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
          Edit: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
          Close: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
          Store: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>,
          Check: (props) => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="20 6 9 17 4 12"></polyline></svg>
        };

        const STORE_INFO = {
          name: "Catering Mama Gigi",
          motto: "Sajian Lezat Tradisional untuk Setiap Acara Anda",
          address: "Jl. Kenangan Indah No. 123, Jakarta Selatan",
          phone: "081234567890", 
          formattedPhone: "0812-3456-7890",
          logo: "https://placehold.co/150x150/f59e0b/ffffff?text=Mama+Gigi"
        };

        const MENU_ITEMS = [
          { id: 'nb1', category: 'Nasi Box', name: 'Nasi Box Ayam Bakar', desc: 'Nasi, Ayam Bakar, Pisang, Sambel, Lalapan, Kerupuk', price: 25000, image: 'https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=400&q=80' },
          { id: 'nb2', category: 'Nasi Box', name: 'Nasi Box Ayam Goreng', desc: 'Nasi, Ayam Goreng, Pisang, Sambel, Lalapan, Kerupuk', price: 25000, image: 'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=400&q=80' },
          { id: 'kt1', category: 'Kue Tradisional', name: 'Nona Manis', desc: 'Kue basah manis pandan yang lembut', price: 3000, image: 'https://images.unsplash.com/photo-1605333398758-c923ce3ebec0?auto=format&fit=crop&w=400&q=80' },
          { id: 'kt2', category: 'Kue Tradisional', name: 'Pastel', desc: 'Pastel isi sayuran dan telur', price: 3000, image: 'https://images.unsplash.com/photo-1604467715878-83e57e8bc129?auto=format&fit=crop&w=400&q=80' },
          { id: 'kt3', category: 'Kue Tradisional', name: 'Risol Mayo', desc: 'Risol isi smoked beef, telur, dan mayo', price: 4000, image: 'https://images.unsplash.com/photo-1599021419736-6e42b2ab6242?auto=format&fit=crop&w=400&q=80' },
          { id: 'kt4', category: 'Kue Tradisional', name: 'Risol Lada Hitam', desc: 'Risol isi ayam lada hitam gurih pedas', price: 4000, image: 'https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=400&q=80' },
          { id: 'kt5', category: 'Kue Tradisional', name: 'Risol Isi Daging Ayam', desc: 'Risol isi daging ayam cincang gurih', price: 4000, image: 'https://images.unsplash.com/photo-1585238341267-1cb9f2a99147?auto=format&fit=crop&w=400&q=80' },
          { id: 'kt6', category: 'Kue Tradisional', name: 'Risol Kentang Wortel', desc: 'Risol isi sayur kentang dan wortel', price: 2500, image: 'https://images.unsplash.com/photo-1628840042765-356cda07504e?auto=format&fit=crop&w=400&q=80' },
          { id: 'kt7', category: 'Kue Tradisional', name: 'Sosis Solo', desc: 'Daging ayam gulung kulit dadar telur', price: 3500, image: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=400&q=80' },
        ];

        const formatRupiah = (number) => {
          return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        };

        const formatDate = (dateString) => {
          if (!dateString) return '-';
          const date = new Date(dateString);
          return new Intl.DateTimeFormat('id-ID', { year: 'numeric', month: 'long', day: 'numeric' }).format(date);
        };

        const cleanFileNameStr = (str) => {
          if (!str) return 'customer';
          return str.toLowerCase().replace(/[^a-z0-9]/g, '');
        };

        function App() {
          const [activeTab, setActiveTab] = useState('menu');
          const [cart, setCart] = useState({});
          const [categoryFilter, setCategoryFilter] = useState('Semua');
          const [searchQuery, setSearchQuery] = useState('');
          const [isMobileCartOpen, setIsMobileCartOpen] = useState(false);

          const [orderSequence, setOrderSequence] = useState(() => {
            return parseInt(localStorage.getItem('mamaGigiSequence') || '0');
          });

          const [orders, setOrders] = useState(() => {
            const saved = localStorage.getItem('mamaGigiOrders');
            return saved ? JSON.parse(saved) : [];
          });

          useEffect(() => {
            localStorage.setItem('mamaGigiOrders', JSON.stringify(orders));
          }, [orders]);

          useEffect(() => {
            localStorage.setItem('mamaGigiSequence', orderSequence.toString());
          }, [orderSequence]);

          const [isCheckoutModalOpen, setIsCheckoutModalOpen] = useState(false);
          const [isInvoiceModalOpen, setIsInvoiceModalOpen] = useState(false);
          const [isEditStatusModalOpen, setIsEditStatusModalOpen] = useState(false);
          
          const [selectedOrder, setSelectedOrder] = useState(null);
          const [toastMessage, setToastMessage] = useState('');

          const initialFormState = {
            name: '', phone: '', address: '', deliveryDate: '', deliveryTime: '',
            paymentMethod: 'BCA', paymentStatus: 'Belum Lunas', amountReceived: '',
            mainPaymentType: 'BANK' 
          };
          const [checkoutForm, setCheckoutForm] = useState(initialFormState);
          const [historyFilters, setHistoryFilters] = useState({ status: 'Semua', search: '', date: '' });

          const showToast = (message) => {
            setToastMessage(message);
            setTimeout(() => setToastMessage(''), 3000);
          };

          const addToCart = (item, qty = 1) => {
            setCart(prev => {
              const currentQty = prev[item.id] ? prev[item.id].qty : 0;
              const newQty = Math.max(0, currentQty + qty);
              if (newQty === 0) {
                const newCart = { ...prev };
                delete newCart[item.id];
                return newCart;
              }
              return { ...prev, [item.id]: { ...item, qty: newQty } };
            });
          };

          const updateCartQtyManual = (item, qty) => {
            const parsedQty = parseInt(qty) || 0;
            if (parsedQty <= 0) {
              setCart(prev => {
                const newCart = { ...prev };
                delete newCart[item.id];
                return newCart;
              });
            } else {
              setCart(prev => ({ ...prev, [item.id]: { ...item, qty: parsedQty } }));
            }
          };

          const clearCart = () => setCart({});

          const cartItems = Object.values(cart);
          const cartTotal = cartItems.reduce((sum, item) => sum + (item.price * item.qty), 0);
          const totalCartCount = cartItems.reduce((sum, item) => sum + item.qty, 0);

          const handleMainPaymentSelect = (mainType) => {
            let defaultSub = 'BCA';
            if (mainType === 'EWALLET') defaultSub = 'DANA';
            if (mainType === 'CASH') defaultSub = 'CASH';
            if (mainType === 'QRIS') defaultSub = 'QRIS';

            setCheckoutForm(prev => ({
              ...prev,
              mainPaymentType: mainType,
              paymentMethod: defaultSub,
              paymentStatus: mainType === 'QRIS' ? 'Belum Lunas' : prev.paymentStatus
            }));
          };

          const handleSubPaymentSelect = (subMethod) => {
            setCheckoutForm(prev => ({
              ...prev,
              paymentMethod: subMethod
            }));
          };

          const handleCheckoutSubmit = (e) => {
            e.preventDefault();
            if (cartItems.length === 0) return showToast('Keranjang masih kosong!');

            const nextSeq = orderSequence + 1;
            const seqStr = String(nextSeq).padStart(3, '0');
            
            let receivedValue = parseInt(checkoutForm.amountReceived) || 0;
            let finalStatus = checkoutForm.paymentStatus;
            
            let dpPaid = 0;
            let balance = cartTotal;
            let change = 0;

            if (finalStatus === 'Lunas') {
              dpPaid = cartTotal;
              balance = 0;
              if (receivedValue > cartTotal) {
                change = receivedValue - cartTotal;
              } else {
                receivedValue = cartTotal;
              }
            } else if (finalStatus === 'DP') {
              if (receivedValue >= cartTotal) {
                finalStatus = 'Lunas';
                dpPaid = cartTotal;
                balance = 0;
                change = receivedValue - cartTotal;
              } else {
                dpPaid = receivedValue;
                balance = cartTotal - dpPaid;
              }
            } else {
              receivedValue = 0;
            }

            const newOrder = {
              id: `ORD-${Date.now().toString().slice(-4)}-${seqStr}`,
              sequence: seqStr,
              createdAt: new Date().toISOString(),
              customer: {
                name: checkoutForm.name,
                phone: checkoutForm.phone,
                address: checkoutForm.address,
              },
              delivery: {
                date: checkoutForm.deliveryDate,
                time: checkoutForm.deliveryTime
              },
              payment: {
                method: checkoutForm.paymentMethod,
                status: finalStatus,
                dpPaid: dpPaid,
                total: cartTotal,
                balance: balance,
                received: receivedValue,
                change: change
              },
              items: cartItems
            };

            setOrderSequence(nextSeq);
            setOrders([newOrder, ...orders]);
            clearCart();
            setCheckoutForm(initialFormState);
            setIsCheckoutModalOpen(false);
            setIsMobileCartOpen(false);
            setSelectedOrder(newOrder);
            setIsInvoiceModalOpen(true);
            showToast('Pesanan berhasil dibuat!');
          };

          const [editStatusForm, setEditStatusForm] = useState({ status: 'Lunas', addDpAmount: '' });
          
          const openEditStatus = (order) => {
            setSelectedOrder(order);
            setEditStatusForm({ status: order.payment.status, addDpAmount: '' });
            setIsEditStatusModalOpen(true);
          };

          const handleEditStatusSubmit = (e) => {
            e.preventDefault();
            if (!selectedOrder) return;

            setOrders(prevOrders => prevOrders.map(order => {
              if (order.id === selectedOrder.id) {
                let newDpPaid = order.payment.dpPaid;
                let newStatus = editStatusForm.status;
                let newReceived = order.payment.received;

                if (newStatus === 'Lunas') {
                  newDpPaid = order.payment.total;
                  newReceived = order.payment.total;
                } else if (newStatus === 'DP') {
                  const addedAmount = parseInt(editStatusForm.addDpAmount) || 0;
                  newDpPaid += addedAmount;
                  newReceived += addedAmount;
                  if (newDpPaid >= order.payment.total) {
                    newStatus = 'Lunas';
                    newDpPaid = order.payment.total;
                  }
                } else if (newStatus === 'Belum Lunas') {
                   newDpPaid = 0; 
                   newReceived = 0;
                }

                const updatedOrder = {
                  ...order,
                  payment: {
                    ...order.payment,
                    status: newStatus,
                    dpPaid: newDpPaid,
                    received: newReceived,
                    balance: order.payment.total - newDpPaid
                  }
                };
                setSelectedOrder(updatedOrder); 
                return updatedOrder;
              }
              return order;
            }));

            setIsEditStatusModalOpen(false);
            showToast('Status pembayaran berhasil diperbarui!');
          };

          const downloadPDF = () => {
            if (!selectedOrder) return;
            const element = document.getElementById('pdf-invoice-content');
            if (!element || !window.html2pdf) {
              showToast('Gagal memuat sistem PDF. Silahkan coba lagi.');
              return;
            }
            
            const safeCustomer = cleanFileNameStr(selectedOrder.customer.name);
            const fileName = `invoice-${safeCustomer}${selectedOrder.sequence}.pdf`;

            const opt = {
              margin: 0,
              filename: fileName,
              image: { type: 'jpeg', quality: 0.98 },
              html2canvas: { scale: 2, useCORS: true, backgroundColor: '#FFFFFF' },
              jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };

            window.html2pdf().set(opt).from(element).save();
          };

          const printThermalInvoice = () => {
            window.print();
          };

          const filteredMenu = useMemo(() => {
            return MENU_ITEMS.filter(item => {
              const matchCategory = categoryFilter === 'Semua' || item.category === categoryFilter;
              const matchSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                  item.desc.toLowerCase().includes(searchQuery.toLowerCase());
              return matchCategory && matchSearch;
            });
          }, [categoryFilter, searchQuery]);

          const filteredOrders = useMemo(() => {
            return orders.filter(order => {
              const matchStatus = historyFilters.status === 'Semua' || order.payment.status === historyFilters.status;
              const matchSearch = order.customer.name.toLowerCase().includes(historyFilters.search.toLowerCase()) ||
                                  order.id.toLowerCase().includes(historyFilters.search.toLowerCase()) ||
                                  order.customer.phone.includes(historyFilters.search);
              const matchDate = !historyFilters.date || order.delivery.date === historyFilters.date || order.createdAt.startsWith(historyFilters.date);
              return matchStatus && matchSearch && matchDate;
            });
          }, [orders, historyFilters]);

          return (
            <div className="min-h-screen bg-gray-100 font-sans text-gray-900 flex flex-col w-full max-w-full overflow-x-hidden">
              
              {toastMessage && (
                <div className="fixed top-5 right-5 z-[100] bg-gray-900 text-white px-5 py-3 rounded-lg shadow-xl text-sm font-medium animate-fade-in-down max-w-[90vw]">
                  {toastMessage}
                </div>
              )}

              {/* Hidden Thermal Print Receipt Area */}
              <div className="hidden print:flex justify-center bg-white absolute inset-0 z-[999]">
                {selectedOrder && (
                  <div className="w-[80mm] text-black text-xs font-sans p-4 mx-auto bg-white">
                    <div className="text-center mb-3">
                      {STORE_INFO.logo && (
                        <img src={STORE_INFO.logo} alt="Logo" className="w-12 h-12 mx-auto rounded-full mb-1 object-cover" />
                      )}
                      <h1 className="text-sm font-bold uppercase tracking-wide">{STORE_INFO.name}</h1>
                      <p className="text-[10px] text-gray-700 leading-tight">{STORE_INFO.address}</p>
                      <p className="text-[10px] text-gray-700">Telp/WA: {STORE_INFO.formattedPhone}</p>
                    </div>
                    
                    <hr className="border-t border-black my-2" />

                    <div className="text-center my-2">
                      <h2 className="text-xs font-bold uppercase tracking-wider">INVOICE</h2>
                      <p className="text-[10px] font-semibold text-gray-800">#{selectedOrder.id}</p>
                    </div>

                    <div className="mb-2 text-[10px] space-y-0.5">
                      <div className="flex justify-between">
                        <span className="text-gray-700 font-medium">Nama Pemesan</span>
                        <span className="font-semibold">{selectedOrder.customer.name}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-700 font-medium">Alamat</span>
                        <span className="text-right max-w-[140px] truncate">{selectedOrder.customer.address}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-700 font-medium">No. HP</span>
                        <span>{selectedOrder.customer.phone}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-700 font-medium">Tanggal Invoice</span>
                        <span>{formatDate(selectedOrder.createdAt)}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-700 font-medium">Tanggal Pengiriman</span>
                        <span>{formatDate(selectedOrder.delivery.date)}</span>
                      </div>
                      <div className="flex justify-between">
                        <span className="text-gray-700 font-medium">Jam Pengiriman</span>
                        <span>{selectedOrder.delivery.time} WIB</span>
                      </div>
                    </div>

                    <hr className="border-t border-black my-2" />

                    <div className="my-2">
                      <div className="flex justify-between font-bold text-[9px] uppercase border-b border-black pb-1 mb-1">
                        <span className="w-2/5">Menu</span>
                        <span className="text-center w-1/5">Qty</span>
                        <span className="text-right w-1/5">Harga</span>
                        <span className="text-right w-1/5">Total</span>
                      </div>
                      {selectedOrder.items.map((item, idx) => (
                        <div key={idx} className="flex justify-between text-[10px] py-0.5">
                          <span className="w-2/5 truncate font-medium">{item.name}</span>
                          <span className="text-center w-1/5">{item.qty}</span>
                          <span className="text-right w-1/5">{formatRupiah(item.price)}</span>
                          <span className="text-right w-1/5 font-semibold">{formatRupiah(item.price * item.qty)}</span>
                        </div>
                      ))}
                    </div>

                    <hr className="border-t border-black my-2" />

                    <div className="mb-3 text-[10px] space-y-1">
                      <div className="flex justify-between">
                        <span>Metode Pembayaran</span>
                        <span className="uppercase font-bold">{selectedOrder.payment.method}</span>
                      </div>
                      <div className="flex justify-between">
                        <span>Subtotal</span>
                        <span>{formatRupiah(selectedOrder.payment.total)}</span>
                      </div>
                      <div className="flex justify-between font-bold text-xs pt-1 border-t border-black">
                        <span>Total</span>
                        <span>{formatRupiah(selectedOrder.payment.total)}</span>
                      </div>
                      
                      {selectedOrder.payment.status === 'Lunas' ? (
                        <>
                          <div className="flex justify-between">
                            <span>Uang Dibayar</span>
                            <span>{formatRupiah(selectedOrder.payment.received || selectedOrder.payment.total)}</span>
                          </div>
                          <div className="flex justify-between">
                            <span>Kembalian</span>
                            <span>{formatRupiah(selectedOrder.payment.change || 0)}</span>
                          </div>
                        </>
                      ) : (
                        <>
                          <div className="flex justify-between">
                            <span>Uang Dibayar (DP)</span>
                            <span>{formatRupiah(selectedOrder.payment.dpPaid)}</span>
                          </div>
                          <div className="flex justify-between font-bold text-red-600">
                            <span>Sisa Tagihan</span>
                            <span>{formatRupiah(selectedOrder.payment.balance)}</span>
                          </div>
                        </>
                      )}

                      <div className="flex justify-between pt-1 border-t border-dashed border-gray-400 font-bold">
                        <span>Status Pembayaran</span>
                        <span className="uppercase">{selectedOrder.payment.status}</span>
                      </div>
                    </div>
                    
                    <hr className="border-t border-black my-3" />

                    <div className="text-center text-[10px] text-gray-700 space-y-0.5">
                      <p>Terima kasih telah mempercayakan pesanan Anda kepada</p>
                      <p className="font-bold text-black">{STORE_INFO.name}</p>
                      <p className="italic">Semoga puas dengan pesanan Anda.</p>
                    </div>
                  </div>
                )}
              </div>

              <div className="print:hidden flex flex-col h-screen overflow-hidden">
                
                <header className="bg-white shadow-md z-10 px-4 sm:px-6 py-3 sm:py-4 flex flex-col md:flex-row items-center justify-between gap-3">
                  <div className="flex items-center gap-3 w-full md:w-auto justify-between md:justify-start">
                    <div className="flex items-center gap-3">

                      </div>
                      
                      <form onSubmit={handleEditStatusSubmit} className="p-4 sm:p-6">
                        <div className="mb-4 sm:mb-5 bg-orange-50 p-3 sm:p-4 rounded-lg text-xs sm:text-sm text-orange-900 border border-orange-100">
                          <p className="font-bold mb-2 pb-2 border-b border-orange-200">Order: #{selectedOrder.id}</p>
                          <div className="flex justify-between mb-1"><span className="text-gray-600">Total Tagihan:</span> <span className="font-bold">{formatRupiah(selectedOrder.payment.total)}</span></div>
                          <div className="flex justify-between mb-1"><span className="text-gray-600">Status Awal:</span> <span className="font-bold">{selectedOrder.payment.status}</span></div>
                          {selectedOrder.payment.status !== 'Lunas' && (
                            <div className="flex justify-between mt-2 pt-2 border-t border-orange-200 text-red-600 font-bold">
                              <span>Sisa Tagihan:</span> <span>{formatRupiah(selectedOrder.payment.balance)}</span>
                            </div>
                          )}
                        </div>

                        <div className="mb-4">
                          <label className="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Ubah Status Menjadi</label>
                          <select 
                            value={editStatusForm.status} 
                            onChange={e => setEditStatusForm({...editStatusForm, status: e.target.value, addDpAmount: ''})}
                            className="w-full border border-gray-300 rounded-lg px-3 py-2 text-xs sm:text-sm focus:ring-2 focus:ring-orange-500 outline-none"
                          >
                            <option value="Belum Lunas">Belum Lunas (Reset)</option>
                            {selectedOrder.payment.status !== 'Lunas' && <option value="DP">Tambah Cicilan / DP</option>}
                            <option value="Lunas">Lunas Sepenuhnya</option>
                          </select>
                        </div>

                        {editStatusForm.status === 'DP' && (
                          <div className="mb-4">
                            <label className="block text-xs sm:text-sm font-medium text-gray-700 mb-1">Nominal Tambahan (Rp)</label>
                            <input 
                              type="number" 
                              required 
                              min="1" 
                              max={selectedOrder.payment.balance}
                              value={editStatusForm.addDpAmount} 
                              onChange={e => setEditStatusForm({...editStatusForm, addDpAmount: e.target.value})}
                              className="w-full border border-gray-300 rounded-lg px-3 py-2 text-xs sm:text-sm focus:ring-2 focus:ring-orange-500 outline-none"
                              placeholder={`Maks: ${selectedOrder.payment.balance}`}
                            />
                            <p className="text-[11px] sm:text-xs text-gray-500 mt-1">Masukkan uang yang dibayarkan sekarang untuk memotong sisa tagihan.</p>
                          </div>
                        )}

                        <div className="flex gap-2 sm:gap-3 justify-end mt-6 sm:mt-8">
                          <button type="button" onClick={() => setIsEditStatusModalOpen(false)} className="px-4 py-2 text-xs sm:text-sm text-gray-600 font-medium hover:bg-gray-100 rounded-lg border">Batal</button>
                          <button type="submit" className="px-5 sm:px-6 py-2 text-xs sm:text-sm bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-md">Simpan</button>
                        </div>
                      </form>
                   </div>
                </div>
              )}

              <style>{`
                @keyframes fadeInUp {
                  from { opacity: 0; transform: translateY(10px); }
                  to { opacity: 1; transform: translateY(0); }
                }
                @keyframes fadeInDown {
                  from { opacity: 0; transform: translateY(-10px); }
                  to { opacity: 1; transform: translateY(0); }
                }
                .animate-fade-in-up {
                  animation: fadeInUp 0.3s ease-out forwards;
                }
                .animate-fade-in-down {
                  animation: fadeInDown 0.3s ease-out forwards;
                }
                .hide-arrows::-webkit-outer-spin-button,
                .hide-arrows::-webkit-inner-spin-button {
                  -webkit-appearance: none;
                  margin: 0;
                }
                .hide-arrows {
                  -moz-appearance: textfield;
                }
                .scrollbar-hide::-webkit-scrollbar {
                    display: none;
                }
                .scrollbar-hide {
                    -ms-overflow-style: none;
                    scrollbar-width: none;
                }
              `}</style>
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
